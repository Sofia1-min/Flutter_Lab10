name: slot_machine_hortunova
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1
environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: 0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 24
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#4527A0"
    theme_color: "#4527A0"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
